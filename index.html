*{box-sizing:border-box;margin:0;padding:0}html{scroll-behavior:smooth}body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#070a0f;color:#f8fafc;min-height:100vh}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh;background:radial-gradient(circle at 80% -10%,rgba(38,255,154,.08),transparent 35%),#070a0f}header{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:18px;padding:14px 24px;border-bottom:1px solid #202936;background:rgba(7,10,15,.88);backdrop-filter:blur(18px)}.logo{background:none;border:0;color:#fff;font-size:22px;font-weight:900;letter-spacing:-1px}.logo span{color:#38f59b}nav{display:flex;gap:4px;flex-wrap:wrap}nav button,.ghost{border:1px solid transparent;background:transparent;color:#aab5c5;padding:9px 12px;border-radius:10px;font-weight:700}nav button:hover,nav button.active{background:#141c26;color:#fff;border-color:#283442}.head-right{display:flex;align-items:center;gap:8px}.notif{border:1px solid #2b3847;background:#10161f;color:#dbe5ef;padding:8px 11px;border-radius:10px;font-size:12px;font-weight:800}.ticker{height:34px;overflow:hidden;border-bottom:1px solid #1c2631;background:#0b1017;display:flex;align-items:center}.ticker-track{white-space:nowrap;animation:scroll 35s linear infinite;font-size:12px;color:#aeb9c8}.ticker b{color:#38f59b}@keyframes scroll{from{transform:translateX(100%)}to{transform:translateX(-100%)}}main{max-width:1440px;margin:auto;padding:28px 24px 60px}.page{display:none}.page.active{display:block}.hero{display:grid;grid-template-columns:1.5fr .8fr;gap:18px;margin-bottom:22px}.hero-main,.card{border:1px solid #202936;background:linear-gradient(145deg,#10161f,#0c1118);border-radius:18px;box-shadow:0 15px 50px rgba(0,0,0,.16)}.hero-main{padding:30px;min-height:250px;display:flex;flex-direction:column;justify-content:flex-end;background:radial-gradient(circle at 85% 15%,rgba(56,245,15 adding:7px 9px;font-size:12px}.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:16px}.filter.active{background:#38f59b;color:#06100b;border-color:#38f59b}.date-nav{display:flex;gap:7px;margin-left:auto}.input,.select,.textarea{width:100%;background:#0b1118;border:1px solid #263340;color:#f8fafc;border-radius:10px;padding:11px 12px;outline:none}.input:focus,.select:focus,.textarea:focus{border-color:#38f59b}.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.form-grid.three{grid-template-columns:repeat(3,1fr)}label{display:grid;gap:7px;font-size:12px;font-weight:800;color:#aeb9c8}.table-wrap{overflow:auto;border:1px solid #202936;border-radius:14px}.table{width:100%;border-collapse:collapse;min-width:650px}.table th,.table td{text-align:left;padding:12px 14px;border-bottom:1px solid #1d2732;font-size:13px}.table th{color:#7f8b9d;font-size:10px;text-transform:uppercase;letter-spacing:1px}.table tr:last-child td{border-bottom:0}.table tr:hover td{background:#0d141c}.pill{display:inline-flex;align-items:center;border:1px solid #293746;background:#101821;padding:4px 8px;border-radius:999px;font-size:10px;font-weight:850}.pill.live{color:#38f59b;border-color:#265d47}.pill.done{color:#aeb9c8}.empty,.loading{padding:32px;text-align:center;color:#8290a2;border:1px dashed #2a3745;border-radius:14px}.skeleton{height:100px;border-radius:14px;background:linear-gradient(90deg,#0d131a,#151d26,#0d131a);background-size:200% 100%;animation:sh 1.2s infinite}@keyframes sh{to{background-position:-200% 0}}.news-card{overflow:hidden}.news-card .news-body{padding:17px}.news-card .date{color:#38f59b;font-size:10px;font-weight:900;text-transform:uppercase}.news-card h3{margin:8px 0;font-size:17px}.news-card p{color:#8e9bad;font-size:12px;line-height:1.6}.article{max-width:900px;margin:auto}.article h1{font-size:clamp(34px,6vw,62px);line-height:1;letter-spacing:-2px;margin:12px 0}.article-meta{color:#8390a0;font-size:12px;margin-bottom:22px}.article-body{font-size:17px;line-height:1.8;color:#c8d1dc;white-space:pre-wrap}.competition-card{padding:20px}.competition-icon{width:48px;height:48px;border-radius:14px;background:#15231e;display:grid;place-items:center;color:#38f59b;font-size:22px;margin-bottom:15px}.competition-card h3{font-size:18px}.competition-card p{color:#8996a7;font-size:12px;margin:6px 0 15px}.team-header,.player-header{padding:24px;display:flex;align-items:center;gap:20px}.team-header img,.player-avatar{width:86px;height:86px;object-fit:contain;border-radius:18px;background:#0b1118;border:1px solid #293542}.player-avatar{display:grid;place-items:center;font-size:28px;font-weight:950;color:#38f59b}.profile-meta h1{font-size:34px;letter-spacing:-1px}.profile-meta p{color:#8794a6;margin-top:5px}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:18px}.kpi{padding:15px;background:#0b1118;border:1px solid #202b37;border-radius:12px}.kpi strong{font-size:24px}.kpi span{display:block;color:#7f8b9d;font-size:10px;text-transform:uppercase;margin-top:4px}.match-hero{padding:30px;text-align:center}.match-hero .teams{max-width:720px;margin:28px auto}.big-score{font-size:48px;font-weight:950;letter-spacing:-2px}.timeline{border-left:2px solid #263340;margin:18px 0 0 18px;padding-left:20px;display:grid;gap:13px}.event{position:relative;padding:10px 12px;border:1px solid #202936;background:#0d141c;border-radius:10px}.event:before{content:"";position:absolute;width:9px;height:9px;border-radius:50%;background:#38f59b;left:-26px;top:15px}.event .minute{font-size:11px;color:#38f59b;font-weight:900}.event strong{font-size:13px}.admin-layout{display:grid;grid-template-columns:300px 1fr;gap:16px}.admin-list{padding:14px}.admin-list .btn{width:100%;text-align:left;margin-bottom:7px}.admin-panel{padding:20px}.log{max-height:220px;overflow:auto;display:grid;gap:6px}.log-item{font-size:11px;color:#8996a7;padding:8px;border-bottom:1px solid #1c2631}.toast{position:fixed;right:18px;bottom:18px;z-index:60;background:#101820;border:1px solid #30404e;padding:12px 15px;border-radius:12px;box-shadow:0 15px 40px rgba(0,0,0,.35);transform:translateY(130px);opacity:0;transition:.25s}.toast.show{transform:none;opacity:1}.db-dot{width:8px;height:8px;border-radius:50%;background:#ff5964;display:inline-block}.db-dot.ok{background:#38f59b}.searchbox{position:relative;max-width:650px}.search-results{display:grid;gap:8px;margin-top:10px}.search-result{padding:13px;border:1px solid #202936;background:#0d141c;border-radius:11px}.search-result strong{display:block}.search-result span{color:#7f8b9d;font-size:11px}.footer{border-top:1px solid #202936;padding:25px 24px;color:#687587;text-align:center;font-size:11px}.hide{display:none!important}.public-note{padding:12px 14px;border:1px solid #202936;background:#0b1118;border-radius:12px;color:#8996a7;font-size:12px}.admin-lock{max-width:520px;margin:40px auto}.admin-lock .card{padding:24px}@media(max-width:1050px){.hero,.admin-layout{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,1fr)}.grid.four{grid-template-columns:repeat(2,1fr)}.head-right{display:none}}@media(max-width:700px){header{padding:12px 14px;align-items:flex-start}nav{overflow:auto;flex-wrap:nowrap;max-width:calc(100vw - 70px)}nav button{white-space:nowrap}.logo{font-size:18px}main{padding:18px 14px 45px}.hero-main{padding:22px;min-height:220px}.hero h1{font-size:42px}.grid,.grid.two,.grid.four,.form-grid,.form-grid.three,.kpis{grid-template-columns:1fr}.date-nav{width:100%;margin-left:0}.date-nav .btn{flex:1}.team-header,.player-header{align-items:flex-start}.profile-meta h1{font-size:27px}.match-hero{padding:20px}.big-score{font-size:38px}.teams{gap:4px}.team img,.team-crest{width:34px;height:34px}}

<body>
<div class="app">
<header>
<button class="logo" onclick="showPage('home',this)">MEFCO <span>WATCH</span></button>
<nav id="nav"><button class="active" data-page="home" onclick="showPage('home',this)">Home</button><button data-page="scores" onclick="showPage('scores',this)">Scores</button><button data-page="news" onclick="showPage('news',this)">News</button><button data-page="competitions" onclick="showPage('competitions',this)">Competitions</button><button data-page="stats" onclick="showPage('stats',this)">Stats</button><button data-page="search" onclick="showPage('search',this)">Search</button><button id="adminNav" data-page="admin" onclick="showPage('admin',this)" class="hide">Admin</button></nav>

</header>
<div class="ticker"><div id="tickerTrack" class="ticker-track">MEFCO Watch • Loading live football data…</div></div>
<main>
<section id="home" class="page active"></section>
<section id="scores" class="page"></section>
<section id="news" class="page"></section>
<section id="article-page" class="page"></section>
<section id="competitions" class="page"></section>
<section id="competition-page" class="page"></section>
<section id="stats" class="page"></section>
<section id="search" class="page"></section>

<section id="player-page" class="page"></section>
<section id="match-page" class="page"></section>

</main>
<footer class="footer">MEFCO WATCH • Football, live.<span style="display:block;margin-top:6px">Public viewer mode • Live data from MEFCO</span></footer>
<div id="toast" class="toast"></div>
</div>
<script>
const SUPABASE_URL="https://qpokxolcdjxtmxrrqlgw.supabase.co";
const SUPABASE_KEY="sb_publishable_7hKSyu9jxd65IA7zfyZy2w_O0maaXdC";
const MATCHES_URL=SUPABASE_URL+"/rest/v1/matches";
const EVENTS_URL=SUPABASE_URL+"/rest/v1/matches-events";
const NEWS_URL=SUPABASE_URL+"/rest/v1/news";
const TEAMS_URL=SUPABASE_URL+"/rest/v1/teams";
const PLAYERS_URL=SUPABASE_URL+"/rest/v1/players";
const COMPETITIONS_URL=SUPABASE_URL+"/rest/v1/competitions";
const NOTIFICATION_API="https://mefco-notifications.drtwelveyt.workers.dev";
const ADMIN_MODE=new URLSearchParams(location.search).get("admin")==="1";
const PUBLIC_MODE=!ADMIN_MODE;
let matches=[],news=[],teams=[],players=[],competitions=[],selectedMatchId=null,selectedArticleId=null,selectedCompetition=null,scoreFilter="all",scoreDate=todayISO(),adminLog=[],timer=null,dbOnline=false;
const esc=v=>String(v??"").replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
function todayISO(){const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
function dateObj(s){return new Date((s||todayISO())+"T00:00:00")}
function fmtDate(s,opts={weekday:'short',month:'short',day:'numeric'}){return new Intl.DateTimeFormat(undefined,opts).format(dateObj(s))}
function fmtTime(t){return t?String(t).slice(0,5):"—"}
function matchDate(m){return m.match_date||m.date||todayISO()}
function matchTime(m){return m.match_time||m.time||"00:00"}
function scoreOf(m){return [Number(m.score_home??m.home_score??0),Number(m.score_away??m.away_score??0)]}
function isLive(m){return String(m.status||'').toLowerCase()==='live'}
function isFinished(m){return String(m.status||'').toLowerCase()==='finished'}
function teamById(id){return teams.find(t=>String(t.id)===String(id))}
function playerById(id){return players.find(p=>String(p.id)===String(id))}
function teamName(id,fallback='Unknown'){return teamById(id)?.name||fallback}
function teamFlag(t){return t?.flag_url||t?.logo_url||''}
function teamDisplayName(m,side){let id=side==='home'?m.home_team_id:m.away_team_id;let fallback=side==='home'?m.home:m.away;return teamName(id,fallback)}
function eventType(e){return String(e.type||e.event_type||'event').toLowerCase()}
function eventPlayer(e){let p=playerById(e.player_id);return p?.short_name||p?.name||e.player_name||e.player||''}
function eventTeam(e){return teamById(e.team_id)?.name||e.team||''}
function showToast(msg){let t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(showToast.t);showToast.t=setTimeout(()=>t.classList.remove('show'),2600)}
async function supabaseFetch(url,options={}){let r=await fetch(url,{...options,headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY,'Content-Type':'application/json',Prefer:'return=representation',...(options.headers||{})}});if(!r.ok)throw new Error(await r.text());return r.status===204?null:r.json()}
async function safeLoad(url,params){return supabaseFetch(url+'?'+new URLSearchParams(params||{}))}
async function loadData(){
 const jobs=await Promise.allSettled([
  safeLoad(MATCHES_URL,{select:'*',order:'match_date.asc,match_time.asc'}),
  safeLoad(NEWS_URL,{select:'*',order:'created_at.desc'}),
  safeLoad(TEAMS_URL,{select:'*',order:'name.asc'}),
  safeLoad(PLAYERS_URL,{select:'*',order:'name.asc'}),
  safeLoad(COMPETITIONS_URL,{select:'*',order:'name.asc'})
 ]);
 matches=jobs[0].status==='fulfilled'&&Array.isArray(jobs[0].value)?jobs[0].value:[];
 news=jobs[1].status==='fulfilled'&&Array.isArray(jobs[1].value)?jobs[1].value:[];
 teams=jobs[2].status==='fulfilled'&&Array.isArray(jobs[2].value)?jobs[2].value:[];
 players=jobs[3].status==='fulfilled'&&Array.isArray(jobs[3].value)?jobs[3].value:[];
 competitions=jobs[4].status==='fulfilled'&&Array.isArray(jobs[4].value)?jobs[4].value:[];
 dbOnline=jobs[0].status==='fulfilled'&&jobs[2].status==='fulfilled'&&jobs[3].status==='fulfilled'&&jobs[4].status==='fulfilled';
 await loadAllEvents();renderAll();
}
async function loadAllEvents(){if(!matches.length)return;try{let data=await safeLoad(EVENTS_URL,{select:'*',order:'minute.asc,created_at.asc'});for(const m of matches)m.events=(data||[]).filter(e=>String(e.match_id)===String(m.id))}catch(e){for(const m of matches)m.events=m.events||[];console.warn(e)}}
function showPage(id,button=null){if(id==='admin'&&!ADMIN_MODE){showToast('Admin mode is not enabled for public viewers');return}document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));let p=document.getElementById(id);if(p)p.classList.add('active');document.querySelectorAll('#nav button').forEach(b=>b.classList.remove('active'));if(button)button.classList.add('active');window.scrollTo({top:0,behavior:'smooth'});({home:renderHome,scores:renderScores,news:renderNews,competitions:renderCompetitions,stats:renderStats,search:renderSearch,admin:renderAdmin}[id]||(()=>{}))()}
function navFor(page){let b=document.querySelector('#nav button[data-page="'+page+'"]');showPage(page,b)}
function renderAll(){renderHome();renderScores();renderNews();renderCompetitions();renderStats();renderSearch();if(ADMIN_MODE)renderAdmin();renderTicker();if(selectedMatchId)renderMatch();}
function renderTicker(){let live=matches.filter(isLive),finished=matches.filter(isFinished).slice(-4);let items=[...live.map(m=>`<b>LIVE</b> ${esc(teamDisplayName(m,'home'))} ${scoreOf(m)[0]}–${scoreOf(m)[1]} ${esc(teamDisplayName(m,'away'))}`),...finished.map(m=>`${esc(teamDisplayName(m,'home'))} ${scoreOf(m)[0]}–${scoreOf(m)[1]} ${esc(teamDisplayName(m,'away'))}`)];document.getElementById('tickerTrack').innerHTML=items.length?items.join(' &nbsp; • &nbsp; '):'MEFCO Watch • No live matches right now • Follow the latest fixtures and results';}
function matchCard(m){let [a,b]=scoreOf(m),live=isLive(m),ht=teamById(m.home_team_id),at=teamById(m.away_team_id);return `<article class="card match-card ${live?'live':''}"><div class="match-top"><span class="competition-label">${esc(m.competition||'MEFCO')}</span>${live?'<span class="live-dot">● LIVE</span>':`<span class="status">${isFinished(m)?'FT':fmtTime(matchTime(m))}</span>`}</div><div class="teams"><div class="team">${ht&&teamFlag(ht)?`<img src="${esc(teamFlag(ht))}" alt="">`:''}<div>${esc(teamDisplayName(m,'home'))}</div></div><div><div class="score">${isFinished(m)||live?a+'–'+b:'VS'}</div>${live?`<div class="status">${Number(m.minute||0)}${m.stoppage?`+${m.stoppage}`:''}'</div>`:''}</div><div class="team">${at&&teamFlag(at)?`<img src="${esc(teamFlag(at))}" alt="">`:''}<div>${esc(teamDisplayName(m,'away'))}</div></div></div><div class="match-bottom"><span class="muted">${fmtDate(matchDate(m),{month:'short',day:'numeric'})}</span><button class="btn small" onclick="openMatch('${esc(m.id)}')">Match Centre</button></div></article>`}
function renderHome(){let el=document.getElementById('home');let today=matches.filter(m=>matchDate(m)===todayISO()).sort((a,b)=>matchTime(a).localeCompare(matchTime(b)));let live=matches.filter(isLive);let latest=[...news].slice(0,3);el.innerHTML=`<div class="hero"><div class="hero-main"><div class="eyebrow">MEFCO Watch</div><h1>The football feed, built around MEFCO.</h1><p>Live scores, national teams, competitions, match centres, news and player statistics — connected directly to MEFCO data.</p><div class="actions" style="margin-top:18px"><button class="btn primary" onclick="navFor('scores')">View Scores</button><button class="btn" onclick="navFor('competitions')">Explore Competitions</button></div></div><div class="card hero-side"><div class="eyebrow">System status</div><h3>${dbOnline?'Live database connected':'Database connection limited'}</h3><div class="mini-grid"><div class="mini-stat"><strong>${matches.length}</strong><span>Matches</span></div><div class="mini-stat"><strong>${teams.length}</strong><span>Teams</span></div><div class="mini-stat"><strong>${players.length}</strong><span>Players</span></div><div class="mini-stat"><strong>${live.length}</strong><span>Live now</span></div></div><button class="btn" style="width:100%;margin-top:12px" onclick="refreshData()"><span class="db-dot ${dbOnline?'ok':''}"></span> Refresh data</button>${PUBLIC_MODE?'':`<div class="public-note" style="margin-top:10px">Admin controls are enabled in this session.</div>`}</div></div><div class="section"><div class="section-head"><div><h2>${live.length?'Live now':'Today'}</h2><p>${live.length?'Matches currently in progress.':fmtDate(todayISO())}</p></div><button class="ghost" onclick="navFor('scores')">All scores →</button></div>${(live.length?live:today).length?`<div class="grid">${(live.length?live:today).slice(0,6).map(matchCard).join('')}</div>`:'<div class="empty">No matches scheduled for today.</div>'}</div><div class="section"><div class="section-head"><div><h2>Latest news</h2><p>Stories from the MEFCO world.</p></div><button class="ghost" onclick="navFor('news')">All news →</button></div>${latest.length?`<div class="grid">${latest.map(newsCard).join('')}</div>`:'<div class="empty">No articles yet.</div>'}</div>`}
function newsCard(n){return `<article class="card news-card"><div class="news-body"><div class="date">${esc(formatNewsDate(n))}</div><h3>${esc(n.title||'Untitled article')}</h3><p>${esc(n.excerpt||n.summary||String(n.body||'').slice(0,150))}</p><button class="btn small" style="margin-top:13px" onclick="openArticle('${esc(n.id)}')">Read article</button></div></article>`}
function formatNewsDate(n){return n.created_at?new Intl.DateTimeFormat(undefined,{month:'short',day:'numeric',year:'numeric'}).format(new Date(n.created_at)):''}
function renderScores(){let el=document.getElementById('scores');let list=matches.filter(m=>matchDate(m)===scoreDate);if(scoreFilter==='live')list=list.filter(isLive);if(scoreFilter==='favorites')list=list.filter(m=>m.favorite);list.sort((a,b)=>matchTime(a).localeCompare(matchTime(b)));el.innerHTML=`<div class="section-head"><div><div class="eyebrow">Scores</div><h2>${fmtDate(scoreDate,{weekday:'long',month:'long',day:'numeric'})}</h2></div><button class="btn" onclick="refreshData()">↻ Refresh</button></div><div class="toolbar"><button class="btn filter ${scoreFilter==='all'?'active':''}" onclick="setScoreFilter('all')">All</button><button class="btn filter ${scoreFilter==='live'?'active':''}" onclick="setScoreFilter('live')">Live</button><button class="btn filter ${scoreFilter==='favorites'?'active':''}" onclick="setScoreFilter('favorites')">Favorites</button><div class="date-nav"><button class="btn" onclick="changeScoreDate(-1)">← Previous</button><button class="btn" onclick="goToToday()">Today</button><button class="btn" onclick="changeScoreDate(1)">Next →</button></div></div>${list.length?`<div class="grid">${list.map(matchCard).join('')}</div>`:'<div class="empty">No matches match this date/filter.</div>'}`}
function setScoreFilter(v){scoreFilter=v;renderScores()}function changeScoreDate(n){let d=dateObj(scoreDate);d.setDate(d.getDate()+n);scoreDate=d.toISOString().slice(0,10);renderScores()}function goToToday(){scoreDate=todayISO();renderScores()}
function renderNews(){document.getElementById('news').innerHTML=`<div class="section-head"><div><div class="eyebrow">News</div><h2>MEFCO newsroom</h2><p>Articles, updates and competition stories.</p></div><button class="btn" onclick="refreshData()">↻ Refresh</button></div>${news.length?`<div class="grid">${news.map(newsCard).join('')}</div>`:'<div class="empty">No news published yet.</div>'}`}
function openArticle(id){selectedArticleId=id;let n=news.find(x=>String(x.id)===String(id));document.getElementById('article-page').innerHTML=n?`<article class="article"><button class="ghost" onclick="navFor('news')">← Back to News</button><div class="eyebrow" style="margin-top:25px">MEFCO News</div><h1>${esc(n.title)}</h1><div class="article-meta">${esc(formatNewsDate(n))}</div><div class="article-body">${esc(n.body||n.content||n.excerpt||'')}</div></article>`:'<div class="empty">Article not found.</div>';showPage('article-page');}
function getCompetitionList(){let map=new Map(competitions.map(c=>[String(c.id),c]));for(const m of matches){if(m.competition_id&&!map.has(String(m.competition_id)))map.set(String(m.competition_id),{id:m.competition_id,name:m.competition||'Competition'});else if(m.competition&&![...map.values()].some(c=>c.name===m.competition))map.set('legacy-'+m.competition,{id:null,name:m.competition})}return [...map.values()]}
function renderCompetitions(){let list=getCompetitionList();document.getElementById('competitions').innerHTML=`<div class="section-head"><div><div class="eyebrow">Competitions</div><h2>MEFCO competitions</h2><p>Every tournament and league connected to match data.</p></div><button class="btn" onclick="refreshData()">↻ Refresh</button></div>${list.length?`<div class="grid">${list.map(c=>`<article class="card competition-card"><div class="competition-icon">⚽</div><h3>${esc(c.name)}</h3><p>${esc(c.short_name||c.type||'Competition')} ${c.season?`• ${esc(c.season)}`:''}</p><div class="actions"><button class="btn small" onclick="openCompetition('${esc(c.id||'')}','${esc(c.name)}')">Open competition</button></div></article>`).join('')}</div>`:'<div class="empty">No competitions found.</div>'}`}
function openCompetition(id,name){selectedCompetition={id,name};let ms=matches.filter(m=>String(m.competition_id)===String(id)||(!m.competition_id&&m.competition===name)||m.competition===name);let c=competitions.find(x=>String(x.id)===String(id));document.getElementById('competition-page').innerHTML=`<button class="ghost" onclick="navFor('competitions')">← Competitions</button><div class="card" style="margin-top:14px;padding:24px"><div class="eyebrow">Competition</div><h1>${esc(c?.name||name)}</h1><p class="muted" style="margin-top:7px">${esc(c?.description||'MEFCO national-team competition')}</p><div class="kpis"><div class="kpi"><strong>${c?.teams_count??new Set(ms.flatMap(m=>[m.home_team_id,m.away_team_id].filter(Boolean))).size}</strong><span>Teams</span></div><div class="kpi"><strong>${ms.length}</strong><span>Matches</span></div><div class="kpi"><strong>${ms.filter(isFinished).length}</strong><span>Completed</span></div><div class="kpi"><strong>${ms.filter(isLive).length}</strong><span>Live</span></div></div></div><div class="section"><div class="section-head"><h2>Fixtures & results</h2></div>${ms.length?`<div class="grid">${ms.map(matchCard).join('')}</div>`:'<div class="empty">No matches linked to this competition yet.</div>'}</div>`;showPage('competition-page')}
function collectPlayerStats(){let out={};for(const p of players)out[p.name]={id:p.id,name:p.name,short_name:p.short_name,team:teamName(p.team_id,p.nationality||''),goals:Number(p.goals||0),assists:Number(p.assists||0)};for(const m of matches){for(const e of m.events||[]){let p=eventPlayer(e);if(!p)continue;let id=e.player_id||p;let key=String(id);let db=playerById(id);if(!db){key=p;if(!out[key])out[key]={name:p,short_name:p,team:eventTeam(e),goals:0,assists:0}}else key=db.name;let x=out[key];let t=eventType(e);if(t.includes('goal'))x.goals++;if(t.includes('assist'))x.assists++}}return Object.values(out)}
function renderStats(){let ps=collectPlayerStats().sort((a,b)=>(b.goals-a.goals)||(b.assists-a.assists));document.getElementById('stats').innerHTML=`<div class="section-head"><div><div class="eyebrow">Statistics</div><h2>Player leaders</h2><p>Event-derived where available, with database profiles underneath.</p></div></div><div class="table-wrap"><table class="table"><thead><tr><th>#</th><th>Player</th><th>Team</th><th>Goals</th><th>Assists</th></tr></thead><tbody>${ps.slice(0,50).map((p,i)=>`<tr><td>${i+1}</td><td><button class="ghost" onclick="openPlayer('${esc(p.id||p.name)}')">${esc(p.short_name||p.name)}</button></td><td>${esc(p.team)}</td><td><b>${p.goals}</b></td><td>${p.assists}</td></tr>`).join('')||'<tr><td colspan="5">No player statistics available.</td></tr>'}</tbody></table></div>`}
function renderSearch(){document.getElementById('search').innerHTML=`<div class="section-head"><div><div class="eyebrow">Search</div><h2>Search MEFCO Watch</h2><p>Teams, players, matches, competitions and news.</p></div></div><div class="searchbox"><input id="globalSearch" class="input" placeholder="Search Spain, Yamal, Global Cup…" oninput="runSearch(this.value)"></div><div id="searchResults" class="search-results"></div>`}
function runSearch(q){q=q.trim().toLowerCase();let el=document.getElementById('searchResults');if(!q){el.innerHTML='';return}let r=[];teams.filter(t=>(t.name+' '+(t.short_name||'')+' '+(t.country||'')).toLowerCase().includes(q)).slice(0,8).forEach(t=>r.push({type:'Team',name:t.name,sub:'National team',fn:()=>openTeam(t.id)}));players.filter(p=>(p.name+' '+(p.short_name||'')+' '+(p.nationality||'')).toLowerCase().includes(q)).slice(0,8).forEach(p=>r.push({type:'Player',name:p.name,sub:teamName(p.team_id,p.position||''),fn:()=>openPlayer(p.id)}));getCompetitionList().filter(c=>String(c.name).toLowerCase().includes(q)).slice(0,5).forEach(c=>r.push({type:'Competition',name:c.name,sub:c.season||'Competition',fn:()=>openCompetition(c.id,c.name)}));matches.filter(m=>(teamDisplayName(m,'home')+' '+teamDisplayName(m,'away')+' '+(m.competition||'')).toLowerCase().includes(q)).slice(0,8).forEach(m=>r.push({type:'Match',name:`${teamDisplayName(m,'home')} vs ${teamDisplayName(m,'away')}`,sub:m.competition||'Match',fn:()=>openMatch(m.id)}));news.filter(n=>String(n.title||'').toLowerCase().includes(q)).slice(0,5).forEach(n=>r.push({type:'News',name:n.title,sub:formatNewsDate(n),fn:()=>openArticle(n.id)}));el.innerHTML=r.length?r.map((x,i)=>`<button class="search-result" onclick="searchOpen(${i})"><strong>${esc(x.name)}</strong><span>${esc(x.type)} • ${esc(x.sub)}</span></button>`).join(''):'<div class="empty">No results.</div>';window._searchResults=r}
function searchOpen(i){window._searchResults?.[i]?.fn()}
function openTeam(idOrName){let t=teamById(idOrName)||teams.find(x=>x.name===idOrName);if(!t){t=teams.find(x=>x.short_name===idOrName)}if(!t){document.getElementById('team-page').innerHTML='<div class="empty">Team not found.</div>';showPage('team-page');return}let squad=players.filter(p=>String(p.team_id)===String(t.id));let ms=matches.filter(m=>String(m.home_team_id)===String(t.id)||String(m.away_team_id)===String(t.id));let wins=ms.filter(m=>isFinished(m)&&((String(m.home_team_id)===String(t.id)&&scoreOf(m)[0]>scoreOf(m)[1])||(String(m.away_team_id)===String(t.id)&&scoreOf(m)[1]>scoreOf(m)[0]))).length;document.getElementById('team-page').innerHTML=`<button class="ghost" onclick="navFor('search')">← Back</button><div class="card team-header" style="margin-top:12px">${teamFlag(t)?`<img src="${esc(teamFlag(t))}" alt="">`:'<div class="player-avatar">⚽</div>'}<div class="profile-meta"><div class="eyebrow">National Team</div><h1>${esc(t.name)}</h1><p>${esc(t.country||t.confederation||'MEFCO')}</p></div></div><div class="kpis"><div class="kpi"><strong>${t.overall??'—'}</strong><span>Overall</span></div><div class="kpi"><strong>${t.attack??'—'}</strong><span>Attack</span></div><div class="kpi"><strong>${t.midfield??'—'}</strong><span>Midfield</span></div><div class="kpi"><strong>${t.defence??'—'}</strong><span>Defence</span></div></div><div class="section"><div class="section-head"><h2>Squad</h2><p>${squad.length} players</p></div>${squad.length?`<div class="table-wrap"><table class="table"><thead><tr><th>Player</th><th>Position</th><th>OVR</th><th>Goals</th><th>Assists</th></tr></thead><tbody>${squad.map(p=>`<tr><td><button class="ghost" onclick="openPlayer('${esc(p.id)}')">${esc(p.short_name||p.name)}</button></td><td>${esc(p.position||'—')}</td><td><b>${p.overall??'—'}</b></td><td>${p.goals??0}</td><td>${p.assists??0}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No players linked to this team.</div>'}</div><div class="section"><div class="section-head"><h2>Fixtures</h2><p>${wins} wins in loaded history</p></div>${ms.length?`<div class="grid">${ms.slice(0,12).map(matchCard).join('')}</div>`:'<div class="empty">No fixtures found.</div>'}</div>`;showPage('team-page')}
function openPlayer(idOrName){let p=playerById(idOrName)||players.find(x=>x.name===idOrName);if(!p){document.getElementById('player-page').innerHTML='<div class="empty">Player not found.</div>';showPage('player-page');return}let derived=collectPlayerStats().find(x=>String(x.id)===String(p.id)||x.name===p.name);document.getElementById('player-page').innerHTML=`<button class="ghost" onclick="navFor('stats')">← Stats</button><div class="card player-header" style="margin-top:12px"><div class="player-avatar">${esc((p.short_name||p.name||'?').slice(0,1))}</div><div class="profile-meta"><div class="eyebrow">Player</div><h1>${esc(p.name)}</h1><p>${esc(teamName(p.team_id,p.nationality||'Free'))} • ${esc(p.position||'Position not set')}</p></div></div><div class="kpis"><div class="kpi"><strong>${p.overall??'—'}</strong><span>OVR</span></div><div class="kpi"><strong>${p.form??'—'}</strong><span>Form</span></div><div class="kpi"><strong>${p.morale??'—'}</strong><span>Morale</span></div><div class="kpi"><strong>${derived?.goals??p.goals??0}</strong><span>Goals</span></div></div><div class="section grid two"><div class="card" style="padding:20px"><div class="eyebrow">Profile</div><div class="table-wrap" style="margin-top:10px"><table class="table"><tbody><tr><td>Short name</td><td>${esc(p.short_name||p.name)}</td></tr><tr><td>Nationality</td><td>${esc(p.nationality||'—')}</td></tr><tr><td>Second nationality</td><td>${esc(p.second_nationality||'—')}</td></tr><tr><td>Position</td><td>${esc(p.position||'—')}</td></tr><tr><td>Preferred foot</td><td>${esc(p.preferred_foot||'—')}</td></tr></tbody></table></div></div><div class="card" style="padding:20px"><div class="eyebrow">Statistics</div><div class="kpis"><div class="kpi"><strong>${p.appearances??0}</strong><span>Apps</span></div><div class="kpi"><strong>${derived?.goals??p.goals??0}</strong><span>Goals</span></div><div class="kpi"><strong>${derived?.assists??p.assists??0}</strong><span>Assists</span></div><div class="kpi"><strong>${p.minutes??0}</strong><span>Minutes</span></div></div></div></div>`;showPage('player-page')}
function openMatch(id){selectedMatchId=id;renderMatch();showPage('match-page')}
function renderMatch(){let m=matches.find(x=>String(x.id)===String(selectedMatchId));let el=document.getElementById('match-page');if(!m){el.innerHTML='<div class="empty">Match not found.</div>';return}let [a,b]=scoreOf(m),events=[...(m.events||[])].sort((x,y)=>(Number(x.minute||0)-Number(y.minute||0)));let ht=teamById(m.home_team_id),at=teamById(m.away_team_id);el.innerHTML=`<button class="ghost" onclick="navFor('scores')">← Scores</button><div class="card match-hero" style="margin-top:12px"><div class="eyebrow">${esc(m.competition||'MEFCO')}</div><div class="muted">${fmtDate(matchDate(m),{weekday:'long',month:'long',day:'numeric'})} • ${fmtTime(matchTime(m))}</div><div class="teams"><div class="team">${ht&&teamFlag(ht)?`<img class="team-crest" src="${esc(teamFlag(ht))}" alt="">`:''}<div>${esc(teamDisplayName(m,'home'))}</div></div><div><div class="big-score">${isFinished(m)||isLive(m)?a+'–'+b:'VS'}</div><div class="status">${isLive(m)?'LIVE • '+Number(m.minute||0)+"'":isFinished(m)?'FULL TIME':esc(m.status||'SCHEDULED')}</div></div><div class="team">${at&&teamFlag(at)?`<img class="team-crest" src="${esc(teamFlag(at))}" alt="">`:''}<div>${esc(teamDisplayName(m,'away'))}</div></div></div></div><div class="section grid two"><div class="card" style="padding:20px"><div class="section-head"><h2>Timeline</h2></div>${events.length?`<div class="timeline">${events.map(e=>`<div class="event"><div class="minute">${Number(e.minute||0)}${e.stoppage?`+${e.stoppage}`:''}' • ${esc(eventType(e))}</div><strong>${esc(eventPlayer(e)||eventTeam(e)||'Match event')}</strong><div class="muted">${esc(e.detail||'')}</div></div>`).join('')}</div>`:'<div class="empty">No events recorded.</div>'}</div><div class="card" style="padding:20px"><div class="section-head"><h2>Match info</h2></div><div class="table-wrap"><table class="table"><tbody><tr><td>Status</td><td>${esc(m.status||'scheduled')}</td></tr><tr><td>Competition</td><td>${esc(m.competition||'—')}</td></tr><tr><td>Kickoff</td><td>${esc(fmtTime(matchTime(m)))}</td></tr><tr><td>Home rating</td><td>${ht?.overall??'—'}</td></tr><tr><td>Away rating</td><td>${at?.overall??'—'}</td></tr></tbody></table></div></div></div>`}
function renderAdmin(){if(!ADMIN_MODE)return;let el=document.getElementById('admin');el.innerHTML=`<div class="section-head"><div><div class="eyebrow">Admin</div><h2>Match control room</h2><p>Manage fixtures, live scores, events and notifications.</p></div><button class="btn" onclick="refreshData()">↻ Reload database</button></div><div class="admin-layout"><div class="card admin-list"><h3 style="margin-bottom:12px">Matches</h3>${matches.length?matches.map(m=>`<button class="btn small" onclick="selectAdminMatch('${esc(m.id)}')">${esc(teamDisplayName(m,'home'))} ${scoreOf(m)[0]}–${scoreOf(m)[1]} ${esc(teamDisplayName(m,'away'))}<br><span class="muted">${fmtDate(matchDate(m),{month:'short',day:'numeric'})}</span></button>`).join(''):'<div class="empty">No matches.</div>'}<hr style="border-color:#202936;margin:12px 0"><button class="btn primary" onclick="showCreateMatch()">+ Create match</button></div><div id="adminPanel" class="card admin-panel"><div class="empty">Select a match to control it.</div></div></div>`;if(selectedMatchId)renderAdminPanel()}
function selectAdminMatch(id){selectedMatchId=id;renderAdminPanel()}
function renderAdminPanel(){let m=matches.find(x=>String(x.id)===String(selectedMatchId));let el=document.getElementById('adminPanel');if(!m)return;let a=scoreOf(m);el.innerHTML=`<div class="row"><div><div class="eyebrow">Selected match</div><h2>${esc(teamDisplayName(m,'home'))} ${a[0]}–${a[1]} ${esc(teamDisplayName(m,'away'))}</h2></div><span class="pill ${isLive(m)?'live':''}">${esc(m.status||'scheduled')}</span></div><div class="section"><div class="form-grid three"><label>Home score<input id="admHome" class="input" type="number" value="${a[0]}" min="0"></label><label>Away score<input id="admAway" class="input" type="number" value="${a[1]}" min="0"></label><label>Minute<input id="admMinute" class="input" type="number" value="${m.minute||0}" min="0"></label></div><div class="actions" style="margin-top:12px"><button class="btn primary" onclick="saveAdminMatch()">Save Match</button><button class="btn" onclick="startSelected()">Start / Resume</button><button class="btn" onclick="pauseSelected()">Pause</button><button class="btn danger" onclick="finishSelected()">Finish</button></div></div><div class="section"><div class="eyebrow">Match event</div><div class="form-grid three"><label>Team<select id="eventTeamSelect" class="select" onchange="refreshEventPlayers()"><option value="">Select team</option>${[m.home_team_id,m.away_team_id].filter(Boolean).map(id=>`<option value="${esc(id)}">${esc(teamName(id))}</option>`).join('')}</select></label><label>Player<select id="eventPlayerSelect" class="select"><option value="">Select player</option></select></label><label>Type<select id="eventType" class="select"><option value="goal">Goal</option><option value="assist">Assist</option><option value="yellow">Yellow card</option><option value="red">Red card</option><option value="substitution">Substitution</option><option value="var">VAR</option><option value="other">Other</option></select></label><label>Minute<input id="eventMinute" class="input" type="number" value="${m.minute||0}"></label><label>Stoppage<input id="eventStoppage" class="input" type="number" value="0"></label><label>Detail<input id="eventDetail" class="input" placeholder="Optional detail"></label></div><div class="actions" style="margin-top:12px"><button class="btn primary" onclick="addEvent()">Add Event</button><button class="btn" onclick="quickEvent('goal')">Quick Goal</button><button class="btn" onclick="quickEvent('yellow')">Quick Yellow</button><button class="btn" onclick="quickEvent('red')">Quick Red</button></div></div><div class="section"><div class="eyebrow">Recent activity</div><div class="log">${(m.events||[]).slice(-10).reverse().map(e=>`<div class="log-item">${esc(e.minute||0)}' • ${esc(eventType(e))} • ${esc(eventPlayer(e)||e.team||'Event')}</div>`).join('')||'<div class="muted">No events.</div>'}</div></div>`}
function refreshEventPlayers(){let teamId=document.getElementById('eventTeamSelect')?.value,sel=document.getElementById('eventPlayerSelect');if(!sel)return;let ps=players.filter(p=>String(p.team_id)===String(teamId));sel.innerHTML='<option value="">No player / team event</option>'+ps.map(p=>`<option value="${esc(p.id)}">${esc(p.short_name||p.name)}</option>`).join('')}
async function updateMatch(id,changes){let m=matches.find(x=>String(x.id)===String(id));Object.assign(m,changes);try{await supabaseFetch(MATCHES_URL+'?id=eq.'+encodeURIComponent(id),{method:'PATCH',body:JSON.stringify(changes)});showToast('Match saved');renderAll()}catch(e){console.error(e);showToast('Could not save match')};}
async function saveAdminMatch(){let m=matches.find(x=>String(x.id)===String(selectedMatchId));if(!m)return;await updateMatch(m.id,{score_home:Number(document.getElementById('admHome').value)||0,score_away:Number(document.getElementById('admAway').value)||0,minute:Number(document.getElementById('admMinute').value)||0})}
async function startSelected(){await updateMatch(selectedMatchId,{status:'live'});startTimer()}
async function pauseSelected(){await updateMatch(selectedMatchId,{status:'scheduled'});stopTimer()}
async function finishSelected(){await updateMatch(selectedMatchId,{status:'finished'});stopTimer()}
function startTimer(){stopTimer();timer=setInterval(async()=>{let m=matches.find(x=>String(x.id)===String(selectedMatchId));if(!m||!isLive(m))return;let minute=Number(m.minute||0)+1;m.minute=minute;renderAdminPanel();renderTicker();try{await supabaseFetch(MATCHES_URL+'?id=eq.'+encodeURIComponent(m.id),{method:'PATCH',body:JSON.stringify({minute})})}catch(e){}},60000)}function stopTimer(){if(timer)clearInterval(timer);timer=null}
async function addEvent(){let m=matches.find(x=>String(x.id)===String(selectedMatchId));if(!m)return;let teamId=document.getElementById('eventTeamSelect').value,playerId=document.getElementById('eventPlayerSelect').value||null;if(teamId&&![String(m.home_team_id),String(m.away_team_id)].includes(String(teamId))){showToast('Event team must be one of the match teams');return}let p=playerById(playerId);let event={match_id:m.id,minute:Number(document.getElementById('eventMinute').value)||Number(m.minute)||0,stoppage:Number(document.getElementById('eventStoppage').value)||0,type:document.getElementById('eventType').value,player_id:playerId,team_id:teamId||null,player:p?.name||'',team:teamName(teamId,''),detail:document.getElementById('eventDetail').value.trim()};try{let result;try{result=await supabaseFetch(EVENTS_URL,{method:'POST',body:JSON.stringify(event)})}catch(first){let legacy={...event};delete legacy.player_id;delete legacy.team_id;result=await supabaseFetch(EVENTS_URL,{method:'POST',body:JSON.stringify(legacy)})}m.events=m.events||[];m.events.push(Array.isArray(result)?result[0]:result);if(event.type==='goal'&&teamId){let changes=String(teamId)===String(m.home_team_id)?{score_home:Number(m.score_home||0)+1}:{score_away:Number(m.score_away||0)+1};await updateMatch(m.id,changes)}else renderAll();showToast('Event added')}catch(e){console.error(e);showToast('Could not add event — check event columns')}}
function quickEvent(type){let s=document.getElementById('eventType');if(s)s.value=type;addEvent()}
function showCreateMatch(){let el=document.getElementById('adminPanel');el.innerHTML=`<div class="eyebrow">New match</div><h2>Create fixture</h2><div class="form-grid" style="margin-top:15px"><label>Competition<select id="createCompetition" class="select"><option value="">Select competition</option>${getCompetitionList().map(c=>`<option value="${esc(c.id||c.name)}" data-name="${esc(c.name)}">${esc(c.name)}</option>`).join('')}</select></label><label>Date<input id="createDate" class="input" type="date" value="${todayISO()}"></label><label>Kickoff<input id="createKickoff" class="input" type="time" value="20:00"></label><label>Home team<select id="createHomeTeam" class="select" onchange="fillCreateFlags()"><option value="">Select home team</option>${teams.map(t=>`<option value="${esc(t.id)}">${esc(t.name)}</option>`).join('')}</select></label><label>Away team<select id="createAwayTeam" class="select" onchange="fillCreateFlags()"><option value="">Select away team</option>${teams.map(t=>`<option value="${esc(t.id)}">${esc(t.name)}</option>`).join('')}</select></label><label>Home flag URL<input id="createHomeFlag" class="input"></label><label>Away flag URL<input id="createAwayFlag" class="input"></label></div><div class="actions" style="margin-top:14px"><button class="btn primary" onclick="createMatch()">Create Match</button></div>`}
function fillCreateFlags(){let h=teamById(document.getElementById('createHomeTeam').value),a=teamById(document.getElementById('createAwayTeam').value);if(h)document.getElementById('createHomeFlag').value=h.flag_url||h.logo_url||'';if(a)document.getElementById('createAwayFlag').value=a.flag_url||a.logo_url||''}
async function createMatch(){let cs=document.getElementById('createCompetition'),h=teamById(document.getElementById('createHomeTeam').value),a=teamById(document.getElementById('createAwayTeam').value);if(!h||!a){showToast('Select both teams');return}let c=cs.options[cs.selectedIndex],name=c?.dataset.name||c?.textContent||'';let match={competition:name,competition_id:cs.value&&!String(cs.value).startsWith('legacy-')?cs.value:null,home:h.name,away:a.name,home_team_id:h.id,away_team_id:a.id,match_date:document.getElementById('createDate').value,match_time:document.getElementById('createKickoff').value,home_flag:document.getElementById('createHomeFlag').value.trim(),away_flag:document.getElementById('createAwayFlag').value.trim(),status:'scheduled',minute:0,score_home:0,score_away:0,stoppage:0,favorite:false};try{let result=await supabaseFetch(MATCHES_URL,{method:'POST',body:JSON.stringify(match)});matches.push(Array.isArray(result)?result[0]:result);showToast('Match created');renderAll()}catch(e){let fallback={...match};delete fallback.competition_id;delete fallback.home_team_id;delete fallback.away_team_id;try{let result=await supabaseFetch(MATCHES_URL,{method:'POST',body:JSON.stringify(fallback)});matches.push(Array.isArray(result)?result[0]:result);showToast('Match created with legacy fields');renderAll()}catch(err){console.error(err);showToast('Could not create match')}}}
async function toggleFavorite(id){let m=matches.find(x=>String(x.id)===String(id));if(!m)return;await updateMatch(id,{favorite:!m.favorite})}
async function refreshData(){showToast('Refreshing MEFCO data…');await document.getElementById('adminNav')?.classList.toggle('hide',!ADMIN_MODE);
loadData();
setInterval(()=>{if(document.visibilityState==='visible')loadData()},30000);showToast('Data refreshed')}
async function enableNotifications(){if(!('Notification'in window)){showToast('Notifications are not supported here');return}let p=await Notification.requestPermission();document.getElementById('notificationButton').textContent=p==='granted'?'Notifications Enabled':p==='denied'?'Notifications Blocked':'Enable Notifications';showToast(p==='granted'?'Notifications enabled':'Notification permission not granted')}
async function sendNotification(title,body,url='/'){try{let r=await fetch(NOTIFICATION_API+'/api/notify',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title,body,url})});if(!r.ok)throw new Error(await r.text());showToast('Notification sent')}catch(e){showToast('Notification service unavailable')}}
function addLog(msg){adminLog.unshift({time:new Date().toLocaleTimeString(),msg});if(adminLog.length>50)adminLog.pop()}
window.addEventListener('keydown',e=>{if(e.key==='/'&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)){e.preventDefault();navFor('search');setTimeout(()=>document.getElementById('globalSearch')?.focus(),50)}if(e.key.toLowerCase()==='r'&&e.ctrlKey){e.preventDefault();refreshData()}});
window.addEventListener('focus',()=>{if(document.visibilityState==='visible')renderTicker()});
document.addEventListener('error',e=>{if(e.target?.tagName==='IMG'){e.target.style.display='none'}},true);
document.getElementById('adminNav')?.classList.toggle('hide',!ADMIN_MODE);
loadData();
setInterval(()=>{if(document.visibilityState==='visible')loadData()},30000);
</script>
</body>
</html>
