<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070a0f"><meta name="description" content="MEFCO Watch — football, live.">
<title>MEFCO Watch</title>
<style>
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#070a0f;color:#f4f7f6;font:14px Inter,system-ui,sans-serif}button,input,select{font:inherit}button{cursor:pointer;color:inherit}.app{min-height:100vh;background:radial-gradient(circle at 50% -20%,#173326 0,#070a0f 45%)}header{height:72px;padding:0 5%;display:flex;align-items:center;gap:35px;position:sticky;top:0;z-index:20;background:#080b10eF;border-bottom:1px solid #ffffff0c;backdrop-filter:blur(18px)}.logo{border:0;background:none;font-size:20px;font-weight:900;letter-spacing:-1px}.logo span{color:#38f59b}nav{display:flex;gap:5px;flex:1}nav button,.btn{background:none;border:0;padding:10px 14px;border-radius:10px;color:#9da7a3}nav button:hover,nav .active{background:#ffffff0a;color:#fff}.head-right{display:flex}.notif,.primary{border:0;background:#38f59b;color:#031008;padding:10px 15px;border-radius:10px;font-weight:800}.ticker{height:34px;overflow:hidden;background:#0b1110;border-bottom:1px solid #ffffff09}.ticker-track{white-space:nowrap;padding:8px 5%;color:#9da9a3;font-size:12px}.ticker-track b{color:#38f59b}.page{display:none;max-width:1450px;margin:auto;padding:34px 5% 70px}.page.active{display:block}.hero{display:grid;grid-template-columns:1.5fr .8fr;gap:18px}.hero-main,.card,.match-card,.panel{background:linear-gradient(145deg,#10171a,#0b1013);border:1px solid #ffffff0b;border-radius:18px;box-shadow:0 15px 45px #0004}.hero-main{padding:38px;min-height:270px;display:flex;flex-direction:column;justify-content:center}.eyebrow{color:#38f59b;font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:1.5px}.hero h1{font-size:clamp(35px,5vw,65px);line-height:.95;margin:12px 0}.hero p{color:#9da7a3;max-width:650px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.section{margin-top:30px}.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:13px}.section-head h2{margin:0;font-size:20px}.muted{color:#89938f}.card{padding:18px}.match-card{padding:16px;position:relative;transition:.18s;cursor:pointer}.match-card:hover{transform:translateY(-2px);border-color:#38f59b33}.match-top,.match-bottom{display:flex;justify-content:space-between;align-items:center}.comp{font-size:11px;color:#87918d}.live{color:#38f59b;font-weight:900}.teams{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;text-align:center;margin:18px 0}.team:first-child{text-align:left}.team:last-child{text-align:right}.team strong{font-size:16px}.score{font-size:27px;font-weight:900}.status{font-size:11px;color:#89938f}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.toolbar input,.toolbar select{background:#0d1417;color:#fff;border:1px solid #ffffff12;border-radius:10px;padding:10px}.date-nav{display:flex;align-items:center;gap:7px;overflow:auto;padding-bottom:12px}.date-nav button{min-width:82px;background:#0d1417;border:1px solid #ffffff0c;border-radius:12px;padding:9px}.date-nav .active{background:#38f59b;color:#031008}.date-nav small{display:block;opacity:.6}.stat-card{text-align:center;padding:22px}.stat-card strong{font-size:31px;display:block}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:13px;border-bottom:1px solid #ffffff08}.table th{color:#7f8985;font-size:11px;text-transform:uppercase}.rank{font-weight:900;color:#38f59b}.news-card{min-height:145px}.news-card h3{margin:8px 0}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.kpi{padding:17px;background:#0d1417;border-radius:14px}.kpi b{font-size:23px;display:block}.pill{display:inline-block;padding:5px 8px;border-radius:99px;background:#ffffff08;color:#aab4b0;font-size:11px}.timeline{border-left:2px solid #ffffff10;padding-left:20px}.event{padding:10px 0}.hide{display:none!important}.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#12191b;border:1px solid #ffffff12;padding:12px 18px;border-radius:12px;opacity:0;pointer-events:none;transition:.2s;z-index:50}.toast.show{opacity:1}.footer{text-align:center;color:#59635f;padding:25px;border-top:1px solid #ffffff08;font-size:12px}
@media(max-width:800px){header{height:62px;padding:0 14px;gap:8px}.logo{font-size:17px}nav{position:fixed;bottom:0;left:0;right:0;background:#090d11F5;border-top:1px solid #ffffff10;padding:7px;justify-content:space-around;z-index:30}nav button{font-size:11px;padding:9px 8px}.head-right{display:none}.page{padding:22px 14px 85px}.hero,.grid,.grid2{grid-template-columns:1fr}.hero-main{padding:27px;min-height:230px}.hero h1{font-size:42px}.kpis{grid-template-columns:repeat(2,1fr)}.teams strong{font-size:14px}}
</style></head><body><div class="app">
<header><button class="logo" onclick="showPage('home',this)">MEFCO <span>WATCH</span></button><nav id="nav"><button class="active" data-page="home" onclick="showPage('home',this)">Home</button><button data-page="scores" onclick="showPage('scores',this)">Scores</button><button data-page="news" onclick="showPage('news',this)">News</button><button data-page="competitions" onclick="showPage('competitions',this)">Competitions</button><button data-page="stats" onclick="showPage('stats',this)">Stats</button><button data-page="search" onclick="showPage('search',this)">Search</button><button id="adminNav" class="hide" data-page="admin" onclick="showPage('admin',this)">Admin</button></nav><button class="notif" onclick="enableNotifications()">Notifications</button></header>
<div class="ticker"><div id="tickerTrack" class="ticker-track">MEFCO Watch • Loading football data…</div></div>
<main><section id="home" class="page active"></section><section id="scores" class="page"></section><section id="news" class="page"></section><section id="article-page" class="page"></section><section id="competitions" class="page"></section><section id="competition-page" class="page"></section><section id="stats" class="page"></section><section id="search" class="page"></section><section id="team-page" class="page"></section><section id="player-page" class="page"></section><section id="match-page" class="page"></section><section id="admin" class="page"></section></main>
<footer class="footer">MEFCO WATCH • Football, live.<br>Public viewer mode • Live data from MEFCO</footer><div id="toast" class="toast"></div></div>
<script>
const SUPABASE_URL="https://qpokxolcdjxtmxrrqlgw.supabase.co",SUPABASE_KEY="sb_publishable_7hKSyu9jxd65IA7zfyZy2w_O0maaXdC",BASE=SUPABASE_URL+"/rest/v1/",ADMIN_MODE=new URLSearchParams(location.search).get("admin")==="1";let matches=[],news=[],teams=[],players=[],competitions=[],events=[],scoreDate=localDate(),scoreFilter="all",selectedMatchId=null,selectedArticleId=null,selectedCompetition=null,pollTimer;
const $=id=>document.getElementById(id),esc=x=>String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m])),localDate=d=>{d=d||new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`},shiftDate=(x,n)=>{let d=new Date(x+"T12:00:00");d.setDate(d.getDate()+n);return localDate(d)},team=id=>teams.find(t=>String(t.id)===String(id)),tname=id=>team(id)?.name||team(id)?.short_name||"Unknown",score=m=>[m.home_score??m.home_goals??0,m.away_score??m.away_goals??0],finished=m=>["finished","ft","completed"].includes(String(m.status||"").toLowerCase()),live=m=>["live","in_progress","playing"].includes(String(m.status||"").toLowerCase());
async function api(path){let r=await fetch(BASE+path,{headers:{apikey:SUPABASE_KEY,Authorization:"Bearer "+SUPABASE_KEY}});if(!r.ok)throw Error(r.status);return r.json()}
async function loadData(){try{[matches,news,teams,players,competitions]=await Promise.all([api("matches?select=*&order=match_date.asc"),api("news?select=*&order=created_at.desc"),api("teams?select=*"),api("players?select=*"),api("competitions?select=*")]);events=await api("matches-events?select=*&order=minute.asc,created_at.asc");dbOnline=true;renderAll()}catch(e){dbOnline=false;toast("MEFCO data connection failed")}}
function toast(x){$("toast").textContent=x;$("toast").classList.add("show");setTimeout(()=>$("toast").classList.remove("show"),2200)}
function showPage(id,btn){document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));$(id)?.classList.add("active");document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("active",x.dataset.page===id));renderAll()}
function card(m){let s=score(m),st=live(m)?`<b class="live">● LIVE ${m.minute?m.minute+"'":""}</b>`:finished(m)?`<span>FT</span>`:`<span>${m.match_time||m.time||""}</span>`;return `<div class="match-card" onclick="openMatch('${m.id}')"><div class="match-top"><span class="comp">${esc(m.competition_name||m.competition||"MEFCO")}</span>${st}</div><div class="teams"><div class="team"><strong>${esc(tname(m.home_team_id||m.home_id))}</strong></div><div class="score">${finished(m)||live(m)?s.join(" — "):"vs"}</div><div class="team"><strong>${esc(tname(m.away_team_id||m.away_id))}</strong></div></div><div class="match-bottom"><span class="status">${m.match_date||""}</span><span class="pill">${m.venue||"Match Centre"}</span></div></div>`}
function renderHome(){let ls=matches.filter(live),today=matches.filter(m=>(m.match_date||m.date||"").slice(0,10)===localDate()),res=matches.filter(finished).slice(-6).reverse(),top=playerStats().slice(0,5);$("home").innerHTML=`<div class="hero"><div class="hero-main"><span class="eyebrow">MEFCO FOOTBALL NETWORK</span><h1>Football.<br><span style="color:#38f59b">Live.</span></h1><p>Scores, matches, competitions, players, teams, news and statistics — all in one MEFCO centre.</p><div><button class="primary" onclick="showPage('scores')">View Scores</button> <button class="btn" onclick="showPage('stats')">Explore Stats</button></div></div><div class="card"><span class="eyebrow">SYSTEM STATUS</span><h2>${dbOnline?"LIVE DATA":"OFFLINE"}</h2><p class="muted">${matches.length} matches • ${teams.length} teams • ${players.length} players</p><div class="kpis"><div class="kpi"><b>${ls.length}</b>Live</div><div class="kpi"><b>${today.length}</b>Today</div></div></div></div><div class="section"><div class="section-head"><h2>Live Now</h2><button class="btn" onclick="showPage('scores')">All Scores →</button></div><div class="grid">${(ls.length?ls:res.slice(0,3)).map(card).join("")||'<div class="card muted">No matches available.</div>'}</div></div><div class="section"><div class="section-head"><h2>Top Scorers</h2><button class="btn" onclick="showPage('stats')">Full Stats →</button></div><div class="grid">${top.slice(0,3).map((p,i)=>`<div class="card"><span class="rank">#${i+1}</span><h3>${esc(p.name)}</h3><b style="font-size:28px">${p.goals}</b><span class="muted"> goals</span></div>`).join("")}</div></div>`}
function renderScores(){let dates=[-2,-1,0,1,2].map(n=>shiftDate(scoreDate,n)),ms=matches.filter(m=>(m.match_date||m.date||"").slice(0,10)===scoreDate);if(scoreFilter==="live")ms=matches.filter(live);if(scoreFilter==="finished")ms=ms.filter(finished);if(scoreFilter==="upcoming")ms=ms.filter(m=>!finished(m)&&!live(m));$("scores").innerHTML=`<div class="section-head"><div><span class="eyebrow">MATCH CENTRE</span><h1>Scores</h1></div><button class="primary" onclick="scoreDate=localDate();renderScores()">Today</button></div><div class="date-nav">${dates.map((d,i)=>`<button class="${d===scoreDate?"active":""}" onclick="scoreDate='${d}';renderScores()">${i===2?"Today":new Date(d+"T12:00:00").toLocaleDateString([],{weekday:"short"})}<small>${d.slice(5)}</small></button>`).join("")}<input type="date" value="${scoreDate}" onchange="scoreDate=this.value;renderScores()"></div><div class="toolbar"><button class="btn" onclick="scoreFilter='all';renderScores()">All</button><button class="btn" onclick="scoreFilter='live';renderScores()">Live</button><button class="btn" onclick="scoreFilter='upcoming';renderScores()">Upcoming</button><button class="btn" onclick="scoreFilter='finished';renderScores()">Finished</button></div><div class="grid">${ms.map(card).join("")||'<div class="card muted">No matches on this date.</div>'}</div>`}
function playerStats(){let out={};events.filter(e=>String(e.type||e.event_type).toLowerCase().includes("goal")).forEach(e=>{let id=e.player_id||e.scorer_id;if(id){let p=players.find(x=>String(x.id)===String(id));if(p){out[id]??={name:p.name||p.full_name||"Player",goals:0,assists:0};out[id].goals++}}});players.forEach(p=>{if(p.goals&&!out[p.id])out[p.id]={name:p.name||p.full_name,goals:+p.goals||0,assists:+p.assists||0}});events.filter(e=>String(e.type||"").toLowerCase().includes("assist")).forEach(e=>{let p=players.find(x=>String(x.id)===String(e.player_id));if(p)(out[p.id]??={name:p.name||p.full_name,goals:0,assists:0}).assists++});return Object.values(out).sort((a,b)=>b.goals-a.goals||b.assists-a.assists)}
function renderStats(){let ps=playerStats(),goals=ps.reduce((a,p)=>a+p.goals,0),assists=ps.reduce((a,p)=>a+p.assists,0);$("stats").innerHTML=`<div class="section-head"><div><span class="eyebrow">MEFCO DATA</span><h1>Statistics</h1></div></div><div class="kpis"><div class="kpi"><b>${goals}</b>Goals</div><div class="kpi"><b>${assists}</b>Assists</div><div class="kpi"><b>${players.length}</b>Players</div><div class="kpi"><b>${teams.length}</b>Teams</div></div><div class="section panel"><div class="section-head"><h2>Player Leaders</h2><span class="pill">Live database</span></div><table class="table"><thead><tr><th>#</th><th>Player</th><th>Goals</th><th>Assists</th><th>Total</th></tr></thead><tbody>${ps.map((p,i)=>`<tr><td class="rank">${i+1}</td><td>${esc(p.name)}</td><td>${p.goals}</td><td>${p.assists}</td><td><b>${p.goals+p.assists}</b></td></tr>`).join("")}</tbody></table></div>`}
function renderNews(){ $("news").innerHTML=`<div class="section-head"><h1>News</h1></div><div class="grid">${news.map(n=>`<article class="card news-card" onclick="openArticle('${n.id}')"><span class="eyebrow">${esc(n.category||"MEFCO")}</span><h3>${esc(n.title)}</h3><p class="muted">${esc(n.excerpt||n.summary||"Latest MEFCO football news.")}</p></article>`).join("")||'<div class="card muted">No news available.</div>'}</div>`}
function renderCompetitions(){let cs=competitions.length?competitions:[...new Set(matches.map(m=>m.competition_name||m.competition).filter(Boolean))].map((name,i)=>({id:i,name}));$("competitions").innerHTML=`<div class="section-head"><h1>Competitions</h1></div><div class="grid">${cs.map(c=>`<div class="card" onclick="selectedCompetition='${c.id}';showPage('competition-page')"><span class="eyebrow">COMPETITION</span><h2>${esc(c.name)}</h2><p class="muted">${matches.filter(m=>String(m.competition_id)===String(c.id)||m.competition_name===c.name).length} matches</p></div>`).join("")||'<div class="card muted">No competitions available.</div>'}</div>`}
function renderSearch(){ $("search").innerHTML=`<h1>Search</h1><div class="toolbar"><input id="searchBox" placeholder="Search teams, players, matches…" oninput="doSearch(this.value)" autofocus></div><div id="searchResults" class="grid"></div>`}
function doSearch(q){q=q.toLowerCase();$("searchResults").innerHTML=[...teams.map(t=>({n:t.name,type:"Team",id:t.id})),...players.map(p=>({n:p.name||p.full_name,type:"Player",id:p.id}))].filter(x=>String(x.n).toLowerCase().includes(q)).slice(0,30).map(x=>`<div class="card"><span class="eyebrow">${x.type}</span><h3>${esc(x.n)}</h3></div>`).join("")}
function renderAll(){if(ADMIN_MODE)$("adminNav").classList.remove("hide");renderHome();renderScores();renderNews();renderCompetitions();renderStats();renderSearch();$("tickerTrack").innerHTML=matches.filter(live).map(m=>`<b>● LIVE</b> ${esc(tname(m.home_team_id))} ${score(m)[0]} — ${score(m)[1]} ${esc(tname(m.away_team_id))}`).join("　•　")||"MEFCO Watch • Football, live."}
function openMatch(id){selectedMatchId=id;let m=matches.find(x=>String(x.id)===String(id));if(!m)return;$("match-page").innerHTML=`<div class="hero-main"><span class="eyebrow">${esc(m.competition_name||m.competition||"MEFCO")}</span><h1>${esc(tname(m.home_team_id))} ${score(m).join(" — ")} ${esc(tname(m.away_team_id))}</h1><p>${m.match_date||""} • ${live(m)?"LIVE":finished(m)?"FULL TIME":"UPCOMING"}</p></div><div class="section panel"><h2>Match Timeline</h2><div class="timeline">${events.filter(e=>String(e.match_id)===String(id)).map(e=>`<div class="event"><b>${e.minute||""}'</b> ${esc(e.type||e.event_type||"Event")} ${esc(e.player_name||"")}</div>`).join("")||'<span class="muted">No events yet.</span>'}</div></div>`;showPage("match-page")}
function openArticle(id){let n=news.find(x=>String(x.id)===String(id));if(!n)return;$("article-page").innerHTML=`<article class="hero-main"><span class="eyebrow">${esc(n.category||"MEFCO")}</span><h1>${esc(n.title)}</h1><p>${esc(n.content||n.body||n.excerpt||"")}</p></article>`;showPage("article-page")}
function renderAdmin(){$("admin").innerHTML=ADMIN_MODE?`<h1>Admin Control Room</h1><div class="grid">${matches.filter(live).map(card).join("")}</div>`:""}
function enableNotifications(){if("Notification"in window)Notification.requestPermission().then(x=>toast(x==="granted"?"Notifications enabled":"Notifications unavailable"))}
function refreshData(){loadData();toast("Refreshing MEFCO data…")}
function startPolling(){if(!pollTimer)pollTimer=setInterval(()=>{if(document.visibilityState==="visible")loadData()},30000)}
window.addEventListener("load",()=>{renderAdmin();loadData();startPolling()});
</script></body></html>
