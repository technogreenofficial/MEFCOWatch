function renderCompetitions(){let x=comps();document.getElementById("competitions").innerHTML=`<div class="section-head"><div><div class="eyebrow">Competitions</div><h2>MEFCO competitions</h2><p>Every tournament and league connected to match data.</p></div><button class="btn" onclick="refreshData()">↻ Refresh</button></div>${x.length?`<div class="grid">${x.map(c=>`<article class="card competition-card"><div class="competition-icon">⚽</div><h3>${esc(c.name)}</h3><p>${esc(c.short_name||c.type||"Competition")} ${c.season?`• ${esc(c.season)}`:""}</p><button class="btn small" onclick="openCompetition('${esc(c.id||"")}','${esc(c.name)}')">Open competition</button></article>`).join("")}</div>`:`<div class="empty">No competitions found.</div>`}`}

function stats(){let o={};players.forEach(p=>o[p.id]={id:p.id,name:p.name,short_name:p.short_name,team:tn(p.team_id,p.nationality||""),goals:+p.goals||0,assists:+p.assists||0});matches.forEach(m=>(m.events||[]).forEach(e=>{let p=player(e.player_id),k=p?p.id:e.player_name||e.player||e.player_id;if(!k)return;o[k]??={id:k,name:e.player_name||e.player||"Unknown",short_name:e.player_name||e.player||"Unknown",team:ee(e),goals:0,assists:0};if(et(e).includes("goal"))o[k].goals++;if(et(e).includes("assist"))o[k].assists++}));return Object.values(o).sort((a,b)=>b.goals-a.goals||b.assists-a.assists)}
function renderStats(){let p=stats();document.getElementById("stats").innerHTML=`<div class="section-head"><div><div class="eyebrow">Statistics</div><h2>Player leaders</h2><p>Goals and assists from player data and match events.</p></div></div><div class="table-wrap"><table class="table"><thead><tr><th>#</th><th>Player</th><th>Team</th><th>Goals</th><th>Assists</th></tr></thead><tbody>${p.slice(0,50).map((x,i)=>`<tr><td>${i+1}</td><td><button class="ghost" onclick="openPlayer('${esc(x.id||x.name)}')">${esc(x.short_name||x.name)}</button></td><td>${esc(x.team)}</td><td><b>${x.goals}</b></td><td>${x.assists}</td></tr>`).join("")||'<tr><td colspan="5">No player statistics available.</td></tr>'}</tbody></table></div>`}
function renderSearch(){document.getElementById("search").innerHTML=`<div class="section-head"><div><div class="eyebrow">Search</div><h2>Search MEFCO Watch</h2><p>Teams, players, matches, competitions and news.</p></div></div><div class="searchbox"><input id="globalSearch" class="input" placeholder="Search Spain, Yamal, Global Cup…" oninput="runSearch(this.value)"></div><div id="searchResults" class="search-results"></div>`}
function runSearch(q){q=q.trim().toLowerCase();let r=[],add=(type,arr)=>arr.forEach(x=>r.push({...x,type}));if(!q)return document.getElementById("searchResults").innerHTML="";add("Team",teams.filter(t=>(t.name+" "+(t.short_name||"")+" "+(t.country||"")).toLowerCase().includes(q)).slice(0,6).map(t=>({name:t.name,sub:"National team",fn:()=>openTeam(t.id)})));add("Player",players.filter(p=>(p.name+" "+(p.short_name||"")+" "+(p.nationality||"")).toLowerCase().includes(q)).slice(0,6).map(p=>({name:p.name,sub:tn(p.team_id,p.position||""),fn:()=>openPlayer(p.id)})));add("Competition",comps().filter(c=>String(c.name).toLowerCase().includes(q)).slice(0,5).map(c=>({name:c.name,sub:c.season||"Competition",fn:()=>openCompetition(c.id,c.name)})));add("Match",matches.filter(m=>(mn(m,"home")+" "+mn(m,"away")+" "+(m.competition||"")).toLowerCase().includes(q)).slice(0,6).map(m=>({name:`${mn(m,"home")} vs ${mn(m,"away")}`,sub:m.competition||"Match",fn:()=>openMatch(m.id)})));add("News",news.filter(n=>String(n.title||"").toLowerCase().includes(q)).slice(0,5).map(n=>({name:n.title,sub:newsDate(n),fn:()=>openArticle(n.id)})));_searchResults=r;document.getElementById("searchResults").innerHTML=r.length?r.map((x,i)=>`<button class="search-result" onclick="searchOpen(${i})"><strong>${esc(x.name)}</strong><span>${esc(x.type)} • ${esc(x.sub)}</span></button>`).join(""):`<div class="empty">No results.</div>`}
function searchOpen(i){_searchResults[i]?.fn()}
function openTeam(id){let t=team(id)||teams.find(x=>x.name===id||x.short_name===id);if(!t)return pageMsg("team-page","Team not found.");let sq=players.filter(p=>String(p.team_id)===String(t.id)),ms=matches.filter(m=>String(m.home_team_id)===String(t.id)||String(m.away_team_id)===String(t.id));document.getElementById("team-page").innerHTML=`<button class="ghost" onclick="nav('search')">← Back</button><div class="card team-header" style="margin-top:12px">${flag(t)?`<img src="${esc(flag(t))}" alt="">`:'<div class="player-avatar">⚽</div>'}<div class="profile-meta"><div class="eyebrow">National Team</div><h1>${esc(t.name)}</h1><p>${esc(t.country||t.confederation||"MEFCO")}</p></div></div><div class="kpis"><div class="kpi"><strong>${t.overall??"—"}</strong><span>Overall</span></div><div class="kpi"><strong>${t.attack??"—"}</strong><span>Attack</span></div><div class="kpi"><strong>${t.midfield??"—"}</strong><span>Midfield</span></div><div class="kpi"><strong>${t.defence??"—"}</strong><span>Defence</span></div></div><div class="section"><div class="section-head"><h2>Squad</h2><p>${sq.length} players</p></div>${sq.length?`<div class="table-wrap"><table class="table"><thead><tr><th>Player</th><th>Position</th><th>OVR</th><th>Goals</th><th>Assists</th></tr></thead><tbody>${sq.map(p=>`<tr><td><button class="ghost" onclick="openPlayer('${esc(p.id)}')">${esc(p.short_name||p.name)}</button></td><td>${esc(p.position||"—")}</td><td><b>${p.overall??"—"}</b></td><td>${p.goals??0}</td><td>${p.assists??0}</td></tr>`).join("")}</tbody></table></div>`:`<div class="empty">No players linked to this team.</div>`}</div><div class="section"><h2>Fixtures</h2><div class="grid" style="margin-top:13px">${ms.slice(0,12).map(card).join("")||'<div class="empty">No fixtures found.</div>'}</div></div>`;showPage("team-page")}
function openPlayer(id){let p=player(id)||players.find(x=>x.name===id);if(!p)return pageMsg("player-page","Player not found.");let s=stats().find(x=>String(x.id)===String(p.id));document.getElementById("player-page").innerHTML=`<button class="ghost" onclick="nav('stats')">← Stats</button><div class="card player-header" style="margin-top:12px"><div class="player-avatar">${esc((p.short_name||p.name||"?")[0])}</div><div class="profile-meta"><div class="eyebrow">Player</div><h1>${esc(p.name)}</h1><p>${esc(tn(p.team_id,p.nationality||"Free"))} • ${esc(p.position||"Position not set")}</p></div></div><div class="kpis"><div class="kpi"><strong>${p.overall??"—"}</strong><span>OVR</span></div><div class="kpi"><strong>${p.form??"—"}</strong><span>Form</span></div><div class="kpi"><strong>${p.morale??"—"}</strong><span>Morale</span></div><div class="kpi"><strong>${s?.goals??p.goals??0}</strong><span>Goals</span></div></div><div class="section grid two"><div class="card" style="padding:20px"><div class="eyebrow">Profile</div><div class="table-wrap"><table class="table"><tbody>${[["Short name",p.short_name||p.name],["Nationality",p.nationality],["Second nationality",p.second_nationality],["Position",p.position],["Preferred foot",p.preferred_foot]].map(x=>`<tr><td>${x[0]}</td><td>${esc(x[1]||"—")}</td></tr>`).join("")}</tbody></table></div></div><div class="card" style="padding:20px"><div class="eyebrow">Statistics</div><div class="kpis"><div class="kpi"><strong>${p.appearances??0}</strong><span>Apps</span></div><div class="kpi"><strong>${s?.goals??p.goals??0}</strong><span>Goals</span></div><div class="kpi"><strong>${s?.assists??p.assists??0}</strong><span>Assists</span></div><div class="kpi"><strong>${p.minutes??0}</strong><span>Minutes</span></div></div></div></div>`;showPage("player-page")}
function openMatch(id){selectedMatchId=id;renderMatch();showPage("match-page")}
function renderMatch(){let m=matches.find(x=>String(x.id)===String(selectedMatchId));if(!m)return pageMsg("match-page","Match not found.");let[a,b]=sc(m),es=[...(m.events||[])].sort((x,y)=>+x.minute-+y.minute),h=team(m.home_team_id),aT=team(m.away_team_id);document.getElementById("match-page").innerHTML=`<button class="ghost" onclick="nav('scores')">← Scores</button><div class="card match-hero" style="margin-top:12px"><div class="eyebrow">${esc(m.competition||"MEFCO")}</div><div class="muted">${fmtDate(md(m),{weekday:"long",month:"long",day:"numeric"})} • ${fmtTime(mt(m))}</div><div class="teams"><div class="team">${h&&flag(h)?`<img class="team-crest" src="${esc(flag(h))}" alt="">`:""}<div>${esc(mn(m,"home"))}</div></div><div><div class="big-score">${live(m)||done(m)?a+"–"+b:"VS"}</div><div class="status">${live(m)?"LIVE • "+(+m.minute||0)+"'":done(m)?"FULL TIME":esc(m.status||"SCHEDULED")}</div></div><div class="team">${aT&&flag(aT)?`<img class="team-crest" src="${esc(flag(aT))}" alt="">`:""}<div>${esc(mn(m,"away"))}</div></div></div></div><div class="section grid two"><div class="card" style="padding:20px"><div class="section-head"><h2>Timeline</h2></div>${es.length?`<div class="timeline">${es.map(e=>`<div class="event"><div class="minute">${+e.minute||0}${e.stoppage?`+${e.stoppage}`:""}' • ${esc(et(e))}</div><strong>${esc(ep(e)||ee(e)||"Match event")}</strong><div class="muted">${esc(e.detail||"")}</div></div>`).join("")}</div>`:`<div class="empty">No events recorded.</div>`}</div><div class="card" style="padding:20px"><div class="section-head"><h2>Match info</h2></div><div class="table-wrap"><table class="table"><tbody><tr><td>Status</td><td>${esc(m.status||"scheduled")}</td></tr><tr><td>Competition</td><td>${esc(m.competition||"—")}</td></tr><tr><td>Kickoff</td><td>${esc(fmtTime(mt(m)))}</td></tr><tr><td>Home rating</td><td>${h?.overall??"—"}</td></tr><tr><td>Away rating</td><td>${aT?.overall??"—"}</td></tr></tbody></table></div></div></div>`}
function renderAdmin(){if(!ADMIN)return;document.getElementById("admin").innerHTML=`<div class="section-head"><div><div class="eyebrow">Admin</div><h2>Match control room</h2><p>Manage fixtures, live scores, events and notifications.</p></div><button class="btn" onclick="refreshData()">↻ Reload database</button></div><div class="admin-layout"><div class="card admin-list"><h3 style="margin-bottom:12px">Matches</h3>${matches.map(m=>`<button class="btn small" onclick="selectAdminMatch('${esc(m.id)}')">${esc(mn(m,"home"))} ${sc(m)[0]}–${sc(m)[1]} ${esc(mn(m,"away"))}<br><span class="muted">${fmtDate(md(m),{month:"short",day:"numeric"})}</span></button>`).join("")||'<div class="empty">No matches.</div>'}<button class="btn primary" style="width:100%" onclick="showCreateMatch()">+ Create match</button></div><div id="adminPanel" class="card admin-panel"><div class="empty">Select a match to control it.</div></div></div>`;if(selectedMatchId)renderAdminPanel()}
function selectAdminMatch(id){selectedMatchId=id;renderAdminPanel()}
function renderAdminPanel(){let m=matches.find(x=>String(x.id)===String(selectedMatchId));if(!m)return;let[a,b]=sc(m);document.getElementById("adminPanel").innerHTML=`<div class="row"><div><div class="eyebrow">Selected match</div><h2>${esc(mn(m,"home"))} ${a}–${b} ${esc(mn(m,"away"))}</h2></div><span class="pill ${live(m)?"live":""}">${esc(m.status||"scheduled")}</span></div><div class="section"><div class="form-grid three"><label>Home score<input id="admHome" class="input" type="number" value="${a}" min="0"></label><label>Away score<input id="admAway" class="input" type="number" value="${b}" min="0"></label><label>Minute<input id="admMinute" class="input" type="number" value="${m.minute||0}" min="0"></label></div><div class="actions" style="margin-top:12px"><button class="btn primary" onclick="saveAdminMatch()">Save Match</button><button class="btn" onclick="startSelected()">Start / Resume</button><button class="btn" onclick="pauseSelected()">Pause</button><button class="btn danger" onclick="finishSelected()">Finish</button></div></div><div class="section"><div class="eyebrow">Match event</div><div class="form-grid three"><label>Team<select id="eventTeamSelect" class="select" onchange="refreshEventPlayers()"><option value="">Select team</option>${[m.home_team_id,m.away_team_id].filter(Boolean).map(id=>`<option value="${esc(id)}">${esc(tn(id))}</option>`).join("")}</select></label><label>Player<select id="eventPlayerSelect" class="select"><option value="">Select player</option></select></label><label>Type<select id="eventType" class="select"><option>goal</option><option>assist</option><option>yellow</option><option>red</option><option>substitution</option><option>var</option><option>other</option></select></label><label>Minute<input id="eventMinute" class="input" type="number" value="${m.minute||0}"></label><label>Stoppage<input id="eventStoppage" class="input" type="number" value="0"></label><label>Detail<input id="eventDetail" class="input" placeholder="Optional detail"></label></div><div class="actions" style="margin-top:12px"><button class="btn primary" onclick="addEvent()">Add Event</button><button class="btn" onclick="quickEvent('goal')">Quick Goal</button><button class="btn" onclick="quickEvent('yellow')">Quick Yellow</button><button class="btn" onclick="quickEvent('red')">Quick Red</button></div></div><div class="section"><div class="eyebrow">Recent activity</div><div class="log">${(m.events||[]).slice(-10).reverse().map(e=>`<div class="log-item">${esc(e.minute||0)}' • ${esc(et(e))} • ${esc(ep(e)||e.team||"Event")}</div>`).join("")||'<div class="muted">No events.</div>'}</div></div>`}
function refreshEventPlayers(){let s=document.getElementById("eventPlayerSelect"),id=document.getElementById("eventTeamSelect")?.value;if(!s)return;s.innerHTML='<option value="">No player / team event</option>'+players.filter(p=>String(p.team_id)===String(id)).map(p=>`<option value="${esc(p.id)}">${esc(p.short_name||p.name)}</option>`).join("")}
async function patch(id,x){let m=matches.find(m=>String(m.id)===String(id));try{await db(U+"/rest/v1/matches?id=eq."+encodeURIComponent(id),{method:"PATCH",body:JSON.stringify(x)});if(m)Object.assign(m,x);toast("Match saved");renderAll()}catch(e){console.error(e);toast("Could not save match")}}
async function saveAdminMatch(){await patch(selectedMatchId,{score_home:+document.getElementById("admHome").value||0,score_away:+document.getElementById("admAway").value||0,minute:+document.getElementById("admMinute").value||0})}
async function startSelected(){await patch(selectedMatchId,{status:"live"});startTimer()}async function pauseSelected(){stopTimer();await patch(selectedMatchId,{status:"scheduled"})}async function finishSelected(){stopTimer();await patch(selectedMatchId,{status:"finished"})}
function startTimer(){stopTimer();timer=setInterval(async()=>{let m=matches.find(x=>String(x.id)===String(selectedMatchId));if(!m||!live(m))return;let minute=(+m.minute||0)+1;m.minute=minute;renderAdminPanel();ticker();try{await db(U+"/rest/v1/matches?id=eq."+encodeURIComponent(m.id),{method:"PATCH",body:JSON.stringify({minute})})}catch(e){}},60000)}function stopTimer(){clearInterval(timer);timer=null}
async function addEvent(){let m=matches.find(x=>String(x.id)===String(selectedMatchId)),teamId=document.getElementById("eventTeamSelect").value,playerId=document.getElementById("eventPlayerSelect").value||null;if(!m)return;if(teamId&&![m.home_team_id,m.away_team_id].map(String).includes(String(teamId)))return toast("Event team must be one of the match teams");let p=player(playerId),e={match_id:m.id,minute:+document.getElementById("eventMinute").value||+m.minute||0,stoppage:+document.getElementById("eventStoppage").value||0,type:document.getElementById("eventType").value,player_id:playerId,team_id:teamId||null,player:p?.name||"",team:tn(teamId,""),detail:document.getElementById("eventDetail").value.trim()};try{let r;try{r=await db(U+"/rest/v1/matches-events",{method:"POST",body:JSON.stringify(e)})}catch(x){let q={...e};delete q.player_id;delete q.team_id;r=await db(U+"/rest/v1/matches-events",{method:"POST",body:JSON.stringify(q)})}m.events??=[];m.events.push(Array.isArray(r)?r[0]:r);if(e.type==="goal"&&teamId){let key=String(teamId)===String(m.home_team_id)?"score_home":"score_away";await patch(m.id,{[key]:sc(m)[key==="score_home"?0:1]+1})}else renderAll();toast("Event added")}catch(x){console.error(x);toast("Could not add event")}}
function quickEvent(x){document.getElementById("eventType").value=x;addEvent()}
function showCreateMatch(){let e=document.getElementById("adminPanel");e.innerHTML=`<div class="eyebrow">New match</div><h2>Create fixture</h2><div class="form-grid" style="margin-top:15px"><label>Competition<select id="createCompetition" class="select"><option value="">Select competition</option>${comps().map(c=>`<option value="${esc(c.id||c.name)}" data-name="${esc(c.name)}">${esc(c.name)}</option>`).join("")}</select></label><label>Date<input id="createDate" class="input" type="date" value="${todayISO()}"></label><label>Kickoff<input id="createKickoff" class="input" type="time" value="20:00"></label><label>Home team<select id="createHomeTeam" class="select"><option value="">Select home team</option>${teams.map(t=>`<option value="${esc(t.id)}">${esc(t.name)}</option>`).join("")}</select></label><label>Away team<select id="createAwayTeam" class="select"><option value="">Select away team</option>${teams.map(t=>`<option value="${esc(t.id)}">${esc(t.name)}</option>`).join("")}</select></label></div><div class="actions" style="margin-top:14px"><button class="btn primary" onclick="createMatch()">Create Match</button></div>`}
async function createMatch(){let c=document.getElementById("createCompetition"),h=team(document.getElementById("createHomeTeam").value),a=team(document.getElementById("createAwayTeam").value);if(!h||!a)return toast("Select both teams");let o=c.options[c.selectedIndex],x={competition:o?.dataset.name||o?.textContent||"",competition_id:c.value&&!String(c.value).startsWith("legacy-")?c.value:null,home:h.name,away:a.name,home_team_id:h.id,away_team_id:a.id,match_date:document.getElementById("createDate").value,match_time:document.getElementById("createKickoff").value,status:"scheduled",minute:0,score_home:0,score_away:0,stoppage:0,favorite:false};try{let r=await db(U+"/rest/v1/matches",{method:"POST",body:JSON.stringify(x)});matches.push(Array.isArray(r)?r[0]:r);toast("Match created");renderAll()}catch(e){delete x.competition_id;delete x.home_team_id;delete x.away_team_id;try{let r=await db(U+"/rest/v1/matches",{method:"POST",body:JSON.stringify(x)});matches.push(Array.isArray(r)?r[0]:r);toast("Match created");renderAll()}catch(e){toast("Could not create match")}}}
async function toggleFavorite(id){let m=matches.find(x=>String(x.id)===String(id));if(m)await patch(id,{favorite:!m.favorite})}
async function refreshData(){toast("Refreshing MEFCO data…");await load();toast("Data refreshed")}
async function enableNotifications(){if(!("Notification"in window))return toast("Notifications are not supported here");let p=await Notification.requestPermission();document.getElementById("notificationButton").textContent=p==="granted"?"Notifications Enabled":p==="denied"?"Notifications Blocked":"Enable Notifications";toast(p==="granted"?"Notifications enabled":"Permission not granted")}
async function sendNotification(title,body,url="/"){try{let r=await fetch(NAPI+"/api/notify",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({title,body,url})});if(!r.ok)throw 0;toast("Notification sent")}catch(e){toast("Notification service unavailable")}}
function pageMsg(id,x){document.getElementById(id).innerHTML=`<div class="empty">${esc(x)}</div>`;showPage(id)}
function startPolling(){clearInterval(pollTimer);pollTimer=setInterval(()=>document.visibilityState==="visible"&&load(),30000)}
document.getElementById("adminNav").classList.toggle("hide",!ADMIN);document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")load()});addEventListener("keydown",e=>{if(e.key==="/"&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){e.preventDefault();nav("search");setTimeout(()=>document.getElementById("globalSearch")?.focus(),50)}if(e.ctrlKey&&e.key.toLowerCase()==="r"){e.preventDefault();refreshData()}});document.addEventListener("error",e=>{if(e.target?.tagName==="IMG")e.target.style.display="none"},true);load();startPolling();
</script></body></html>
